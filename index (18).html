<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicago Baseball Fandom Map - Crosstown Divide</title>
    <!-- Tailwind CSS for UI Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- React and Babel CDNs for Natively Running React in browser -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts for Sports Scoreboard Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Graduate&family=Public+Sans:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #0f172a;
        }
        .scoreboard-font {
            font-family: 'Share Tech Mono', monospace;
        }
        .stadium-font {
            font-family: 'Graduate', serif;
        }
        /* Custom map styling to remove default borders and integrate cleanly */
        #map-container {
            height: calc(100vh - 84px);
        }
        /* Custom scrollbar styling for the sidebar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="text-slate-100 overflow-hidden h-screen w-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Configuration constants matching team specifications
        const TEAM_COLORS = {
            cubsBlue: '#0E3386',
            cubsRed: '#CC3433',
            cubsLight: '#3b82f6',
            soxBlack: '#111111',
            soxSilver: '#A4A9AD',
            soxDarkGrey: '#27251F',
            neutralGrey: '#475569',
            tossUp: '#f8fafc'
        };

        const WRIGLEY_COORDS = [41.9484, -87.6553];
        const RATE_FIELD_COORDS = [41.8299, -87.6337];

        // Custom Helper function to interpolate colors for the choropleth layer
        function getFeatureColor(cubsShare) {
            if (cubsShare === 0.5) return TEAM_COLORS.tossUp;
            
            if (cubsShare > 0.5) {
                // Blend from light blue to historic Cubs blue based on strength
                if (cubsShare < 0.65) return '#60a5fa'; // Leans Cubs
                if (cubsShare < 0.85) return '#2563eb'; // Solid Cubs
                return TEAM_COLORS.cubsBlue;            // Supermajority Cubs
            } else {
                const soxShare = 1 - cubsShare;
                if (soxShare < 0.65) return '#94a3b8';  // Leans Sox
                if (soxShare < 0.85) return '#475569';  // Solid Sox
                return TEAM_COLORS.soxBlack;            // Supermajority Sox
            }
        }

        // --- SIDEBAR COMPONENT ---
        function ScoreboardPanel({ activeBlock, totalLoadedBlocks }) {
            return (
                <div className="w-full lg:w-96 xl:w-[420px] bg-slate-950 border-r border-slate-800 flex flex-col h-full overflow-y-auto">
                    {/* Header Banner - Baseball Marquee Theme */}
                    <div className="bg-gradient-to-b from-slate-900 to-slate-950 p-5 border-b-4 border-emerald-800 shadow-xl relative overflow-hidden">
                        <div className="absolute right-[-20px] top-[-20px] opacity-5 transform rotate-12">
                            <svg width="120" height="120" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                            </svg>
                        </div>
                        <h1 className="stadium-font text-xl text-center text-amber-400 tracking-wider font-bold uppercase drop-shadow">
                            Crosstown Divide
                        </h1>
                        <p className="text-center text-xs text-slate-400 font-semibold tracking-widest uppercase mt-1">
                            Chicago Fan Allegiance Map
                        </p>
                    </div>

                    {/* Main Stats Segment */}
                    <div className="p-5 flex-1 flex flex-col gap-6">
                        {!activeBlock ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-center p-6 bg-slate-900/40 border border-dashed border-slate-800 rounded-xl my-auto">
                                <div className="w-16 h-16 rounded-full bg-emerald-950 border border-emerald-500/30 flex items-center justify-center mb-4 text-emerald-400 animate-bounce">
                                    ⚾
                                </div>
                                <h3 className="stadium-font text-sm font-bold text-slate-200 uppercase tracking-wider mb-2">Batter Up!</h3>
                                <p className="text-xs text-slate-400 leading-relaxed max-w-xs">
                                    Hover or click on any individual census block to unlock hyper-local stadium visit tracking data.
                                </p>
                                <div className="mt-8 pt-4 border-t border-slate-900 w-full text-left">
                                    <span className="text-[10px] uppercase font-bold text-slate-500 tracking-wider block mb-1">Dataset Coverage:</span>
                                    <span className="text-xs text-emerald-400 font-mono font-bold bg-emerald-950/40 px-2 py-1 rounded border border-emerald-900/50">
                                        {totalLoadedBlocks.toLocaleString()} Active Blocks Monitored
                                    </span>
                                </div>
                            </div>
                        ) : (
                          <div className="space-y-6">
                            {/* Block Information Plate */}
                            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 relative overflow-hidden shadow-inner">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-[10px] font-bold uppercase text-slate-400 bg-slate-800 px-2 py-0.5 rounded tracking-wider">
                                        Census Geography ID
                                    </span>
                                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-ping" />
                                </div>
                                <div className="scoreboard-font text-lg text-emerald-400 tracking-wider">
                                    {activeBlock.geoid}
                                </div>
                                <div className="mt-3 pt-2 border-t border-slate-800/60 flex items-center justify-between">
                                    <span className="text-xs text-slate-400 font-medium">Territorial Rule:</span>
                                    <span className={`text-xs font-bold px-2 py-0.5 rounded uppercase tracking-wider ${
                                        activeBlock.cubs_share > 0.5 
                                            ? 'bg-blue-950 text-blue-400 border border-blue-900' 
                                            : activeBlock.sox_share > 0.5 
                                                ? 'bg-zinc-900 text-zinc-300 border border-zinc-800' 
                                                : 'bg-slate-800 text-slate-300'
                                    }`}>
                                        {activeBlock.cubs_share > 0.5 ? '🔴 Cubs Domain' : activeBlock.sox_share > 0.5 ? '⚪ Sox Domain' : '⚔️ Toss-Up Zone'}
                                    </span>
                                </div>
                            </div>

                            {/* Massive Scoreboard Display - The Fan Share Bar split */}
                            <div>
                                <h3 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-3 flex items-center gap-2">
                                    <span>📊</span> Fan Allegiance Split
                                </h3>
                                
                                <div className="grid grid-cols-2 gap-px bg-slate-800 rounded-xl overflow-hidden border border-slate-800 shadow-md">
                                    {/* Cubs Display Panel */}
                                    <div className="bg-slate-900 p-4 text-center border-r border-slate-800/80">
                                        <div className="stadium-font text-[11px] font-bold text-blue-400 uppercase tracking-widest mb-1">CUBS</div>
                                        <div className="scoreboard-font text-3xl font-black text-white drop-shadow">
                                            {(activeBlock.cubs_share * 100).toFixed(1)}<span className="text-sm text-blue-500">%</span>
                                        </div>
                                    </div>
                                    {/* White Sox Display Panel */}
                                    <div className="bg-slate-900 p-4 text-center">
                                        <div className="stadium-font text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1">WHITE SOX</div>
                                        <div className="scoreboard-font text-3xl font-black text-white drop-shadow">
                                            {(activeBlock.sox_share * 100).toFixed(1)}<span className="text-sm text-slate-500">%</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Custom Responsive Base-Line Visual Chart (Baseball Themed Split-Bar) */}
                                <div className="mt-4 bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                                    <div className="flex justify-between text-xs text-slate-400 font-semibold px-1">
                                        <span className="flex items-center gap-1"><span className="text-blue-500">🔵</span> Wrigley Field Arrivals</span>
                                        <span className="flex items-center gap-1">Guaranteed Rate <span className="text-zinc-400">⚪</span></span>
                                    </div>
                                    
                                    {/* Continuous Dual Scale Bar Chart */}
                                    <div className="w-full h-6 bg-slate-950 rounded-full overflow-hidden flex border border-slate-800 p-0.5">
                                        <div 
                                            className="h-full bg-gradient-to-r from-blue-700 to-blue-500 rounded-l-full transition-all duration-300 relative flex items-center justify-start pl-2"
                                            style={{ width: `${activeBlock.cubs_share * 100}%` }}
                                        >
                                            {activeBlock.cubs_share > 0.15 && (
                                                <span className="text-[10px] font-bold text-white scoreboard-font">
                                                    {Math.round(activeBlock.cubs_share * 100)}
                                                </span>
                                            )}
                                        </div>
                                        <div 
                                            className="h-full bg-gradient-to-r from-zinc-600 to-zinc-900 rounded-r-full transition-all duration-300 relative flex items-center justify-end pr-2"
                                            style={{ width: `${activeBlock.sox_share * 100}%` }}
                                        >
                                            {activeBlock.sox_share > 0.15 && (
                                                <span className="text-[10px] font-bold text-zinc-300 scoreboard-font">
                                                    {Math.round(activeBlock.sox_share * 100)}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                    
                                    <p className="text-[11px] text-slate-500 leading-normal text-center italic pt-1">
                                        Calculated directly based on the unique geographic trip distribution metrics found inside your 2020 Census framework.
                                    </p>
                                </div>
                            </div>

                            {/* Graphic Stadium Diamond Loyalty Position Chart */}
                            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                <h3 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-4">
                                    🏟️ Home Plate Bias Index
                                </h3>
                                <div className="flex items-center justify-center py-2">
                                    <div className="relative w-28 h-28 transform rotate-45 border-2 border-slate-700/60 flex items-center justify-center bg-slate-950/40">
                                        {/* Diamond bases layout */}
                                        <div className="absolute top-0 left-0 w-3 h-3 bg-slate-700 -translate-x-1.5 -translate-y-1.5 rounded-sm" title="Third Base" />
                                        <div className="absolute top-0 right-0 w-3 h-3 bg-slate-700 translate-x-1.5 -translate-y-1.5 rounded-sm" title="Second Base" />
                                        <div className="absolute bottom-0 left-0 w-3 h-3 bg-slate-700 -translate-x-1.5 translate-y-1.5 rounded-sm" title="Home Plate" />
                                        <div className="absolute bottom-0 right-0 w-3 h-3 bg-slate-700 translate-x-1.5 translate-y-1.5 rounded-sm" title="First Base" />
                                        
                                        {/* Dynamic Ball position shifting north or south */}
                                        <div 
                                            className={`w-7 h-7 rounded-full shadow-lg border flex items-center justify-center font-bold text-xs transform -rotate-45 transition-all duration-500 ${
                                                activeBlock.cubs_share > 0.5 
                                                    ? 'bg-blue-600 text-white border-white' 
                                                    : activeBlock.sox_share > 0.5 
                                                        ? 'bg-zinc-100 text-slate-950 border-black' 
                                                        : 'bg-amber-400 text-slate-950 border-white'
                                            }`}
                                            style={{
                                                transform: `rotate(-45deg) translate(${(activeBlock.cubs_share - 0.5) * 40}px, ${(activeBlock.sox_share - 0.5) * 40}px)`
                                            }}
                                        >
                                            ⚾
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-between text-[10px] font-mono text-slate-500 uppercase mt-4 px-2">
                                    <span className="text-blue-500 font-bold">North Side Bias</span>
                                    <span className="text-zinc-400 font-bold">South Side Bias</span>
                                </div>
                            </div>
                          </div>
                        )}
                    </div>

                    {/* Uniform Legend Indicator Block */}
                    <div className="p-4 bg-slate-950 border-t border-slate-900 text-xs">
                        <span className="text-[10px] font-bold text-slate-500 uppercase block mb-2 tracking-wider">
                            Map Allegiopole Scale Key
                        </span>
                        <div className="flex h-3 w-full rounded bg-gradient-to-r from-black via-slate-500 to-blue-700 border border-slate-800" />
                        <div className="flex justify-between text-[9px] font-mono text-slate-400 mt-1">
                            <span>100% Sox</span>
                            <span>50/50 Split</span>
                            <span>100% Cubs</span>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAP CONTAINER COMPONENT CONTROLLED NATIVELY ---
        function BaseballMap({ onFeatureHover, setTotalBlocks }) {
            const mapRef = useRef(null);
            const geoJsonLayerRef = useRef(null);

            useEffect(() => {
                // Initialize the native Leaflet map container centered directly in Chicago
                mapRef.current = L.map('leaflet-map-element', {
                    center: [41.8781, -87.6298],
                    zoom: 11,
                    zoomControl: false
                });

                // Add Zoom controls to top-right corner to clear sidebar space
                L.control.zoom({ position: 'topright' }).addTo(mapRef.current);

                // Add premium Dark Matter basemap tiles to let the custom team colors pop vibrantly
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
                }).addTo(mapRef.current);

                // Insert Custom Landmark Markers for Wrigley and Guaranteed Rate Fields
                const cubsIcon = L.divIcon({
                    className: 'custom-stadium-marker',
                    html: `<div class="flex flex-col items-center shadow-2xl"><div class="bg-blue-600 text-white font-black border border-white rounded px-1.5 py-0.5 text-[9px] whitespace-nowrap tracking-tighter shadow">WRIGLEY FIELD ⚾</div><div class="w-1.5 h-1.5 bg-blue-600 border border-white rounded-full"></div></div>`,
                    iconSize: [80, 20],
                    iconAnchor: [40, 15]
                });

                const soxIcon = L.divIcon({
                    className: 'custom-stadium-marker',
                    html: `<div class="flex flex-col items-center shadow-2xl"><div class="bg-black text-white font-black border border-zinc-500 rounded px-1.5 py-0.5 text-[9px] whitespace-nowrap tracking-tighter shadow">THE RATE 🏟️</div><div class="w-1.5 h-1.5 bg-black border border-white rounded-full"></div></div>`,
                    iconSize: [80, 20],
                    iconAnchor: [40, 15]
                });

                L.marker(WRIGLEY_COORDS, { icon: cubsIcon }).addTo(mapRef.current);
                L.marker(RATE_FIELD_COORDS, { icon: soxIcon }).addTo(mapRef.current);

                // Fetch the generated data file asynchronously from the backend/public catalog
                fetch('./chicago_baseball_map.geojson')
                    .then(res => {
                        if (!res.ok) throw new Error("Could not fetch chicago_baseball_map.geojson file");
                        return res.json();
                    })
                    .then(geojsonData => {
                        setTotalBlocks(geojsonData.features.length);

                        // Define styling functions for the geojson polygons
                        function styleFeature(feature) {
                            const cubsShare = feature.properties.cubs_share || 0;
                            return {
                                fillColor: getFeatureColor(cubsShare),
                                weight: 0.5,
                                opacity: 0.6,
                                color: '#ffffff',
                                fillOpacity: 0.55
                            };
                        }

                        // Attach listeners to every individual geojson shape
                        function onEachFeature(feature, layer) {
                            layer.on({
                                mouseover: (e) => {
                                    const layer = e.target;
                                    layer.setStyle({
                                        weight: 2,
                                        color: '#F59E0B', // Highlight frame color (Amber)
                                        fillOpacity: 0.85
                                    });
                                    if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                                        layer.bringToFront();
                                    }
                                    // Trigger the react interaction state immediately
                                    onFeatureHover(feature.properties);
                                },
                                mouseout: (e) => {
                                    geoJsonLayerRef.current.resetStyle(e.target);
                                },
                                click: (e) => {
                                    mapRef.current.fitBounds(e.target.getBounds(), { maxZoom: 14 });
                                    onFeatureHover(feature.properties);
                                }
                            });
                        }

                        // Generate the Leaflet layer assembly pipeline
                        geoJsonLayerRef.current = L.geoJSON(geojsonData, {
                            style: styleFeature,
                            onEachFeature: onEachFeature
                        }).addTo(mapRef.current);
                    })
                    .catch(err => {
                        console.error("Error mapping features over Leaflet context: ", err);
                    });

                // Cleanup hook layer safely on component unmount loops
                return () => {
                    if (mapRef.current) {
                        mapRef.current.remove();
                    }
                };
            }, [onFeatureHover, setTotalBlocks]);

            return <div id="leaflet-map-element" className="w-full h-full bg-slate-900" />;
        }

        // --- CORE APPLICATION EXECUTIVE WRAPPER ---
        export default function App() {
            const [activeBlock, setActiveBlock] = useState(null);
            const [totalBlocks, setTotalBlocks] = useState(0);

            // Debounce or encapsulate the update to ensure high performance map renders
            const handleFeatureHover = useMemo(() => (properties) => {
                setActiveBlock(properties);
            }, []);

            return (
                <div className="flex flex-col lg:flex-row h-screen w-screen overflow-hidden bg-slate-900">
                    
                    {/* Main Sidebar Panel Section Layout */}
                    <ScoreboardPanel activeBlock={activeBlock} totalLoadedBlocks={totalBlocks} />

                    {/* Geographic Visual Map Stage Layout */}
                    <div className="flex-1 h-full relative">
                        {/* Top Accent Floating App Ribbon banner */}
                        <div className="absolute top-4 left-4 z-[1000] bg-slate-950/90 border border-slate-800 rounded-lg px-4 py-2 shadow-2xl hidden md:flex items-center gap-3 backdrop-blur-sm">
                            <div className="flex items-center gap-1.5 text-xs text-slate-400">
                                <span className="inline-block w-3 h-3 bg-blue-700 rounded-sm border border-white" />
                                <span>Cubs Lead</span>
                            </div>
                            <div className="flex items-center gap-1.5 text-xs text-slate-400">
                                <span className="inline-block w-3 h-3 bg-black rounded-sm border border-slate-600" />
                                <span>Sox Lead</span>
                            </div>
                            <div className="w-px h-3 bg-slate-800" />
                            <div className="text-[11px] font-mono text-slate-400">
                                Tip: Hover to scan, click to isolate boundaries
                            </div>
                        </div>

                        <BaseballMap onFeatureHover={handleFeatureHover} setTotalBlocks={setTotalBlocks} />
                    </div>

                </div>
            );
        }

        // Mount process loop initialization execution
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
