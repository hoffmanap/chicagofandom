<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicago Baseball Fandom Map - Crosstown Divide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Graduate&family=Public+Sans:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #0f172a;
        }
        .scoreboard-font {
            font-family: 'Share Tech Mono', monospace;
        }
        .stadium-font {
            font-family: 'Graduate', serif;
        }
        #leaflet-map-element {
            height: 100%;
            width: 100%;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="text-slate-100 overflow-hidden h-screen w-screen bg-slate-900">

    <div id="root" class="h-full w-full"></div>

    <script>
      Babel.registerPreset('react-classic', {
        presets: [
          [Babel.availablePresets['react'], { runtime: 'classic' }]
        ]
      });
    </script>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef, useMemo } = React;

        const TEAM_COLORS = {
            cubsBlue: '#0E3386',
            cubsRed: '#CC3433',
            cubsLight: '#3b82f6',
            soxBlack: '#111111',
            soxSilver: '#A4A9AD',
            soxDarkGrey: '#27251F',
            neutralGrey: '#64748b',
            tossUp: '#475569'
        };

        const WRIGLEY_COORDS = [41.9484, -87.6553];
        const RATE_FIELD_COORDS = [41.8299, -87.6337];

        // Safe helper to normalize any input format (decimal vs 0-100 percentage) to a clean 0.0 - 1.0 fraction
        function normalizeShare(val) {
            const parsed = parseFloat(val);
            if (isNaN(parsed)) return 0;
            return parsed > 1.0 ? parsed / 100 : parsed;
        }

        function getFeatureColor(cubsShare) {
            const normCubs = normalizeShare(cubsShare);
            if (normCubs === 0.5) return '#cbd5e1'; // Light grey toss-up on the light map background
            
            if (normCubs > 0.5) {
                if (normCubs < 0.65) return '#93c5fd'; // Light blue
                if (normCubs < 0.85) return '#3b82f6'; // Mid blue
                return TEAM_COLORS.cubsBlue;            // Deep Cubs blue
            } else {
                const soxShare = 1 - normCubs;
                if (soxShare < 0.65) return '#94a3b8';  // Slate grey
                if (soxShare < 0.85) return '#475569';  // Dark steel grey
                return TEAM_COLORS.soxBlack;            // Solid White Sox black
            }
        }

        function ScoreboardPanel({ activeBlock, totalLoadedBlocks, isLoading, loadedChunks }) {
            // Compute safely normalized fractions for UI presentation elements
            const { cubsFract, soxFract } = useMemo(() => {
                if (!activeBlock) return { cubsFract: 0, soxFract: 0 };
                const c = normalizeShare(activeBlock.cubs_share);
                const s = normalizeShare(activeBlock.sox_share);
                return { cubsFract: c, soxFract: s };
            }, [activeBlock]);

            return (
                <div className="w-full lg:w-96 xl:w-[420px] bg-slate-950 border-r border-slate-800 flex flex-col h-full overflow-y-auto">
                    {/* Header Banner - Baseball Marquee Theme */}
                    <div className="bg-gradient-to-b from-slate-900 to-slate-950 p-5 border-b-4 border-emerald-800 shadow-xl relative overflow-hidden">
                        <h1 className="stadium-font text-xl text-center text-amber-400 tracking-wider font-bold uppercase drop-shadow">
                            Crosstown Divide
                        </h1>
                        <p className="text-center text-xs text-slate-400 font-semibold tracking-widest uppercase mt-1">
                            Chicago Fan Allegiance Map
                        </p>
                    </div>

                    {/* Progressive loading panel */}
                    {isLoading && (
                        <div className="bg-emerald-950/30 border-b border-emerald-900/50 px-5 py-2 text-center text-xs font-mono text-emerald-400 flex justify-between items-center">
                            <span className="animate-pulse">⏳ Loading Map Sections...</span>
                            <span>{loadedChunks} / 4 loaded</span>
                        </div>
                    )}

                    {/* Main Stats Segment */}
                    <div className="p-5 flex-1 flex flex-col gap-6">
                        {!activeBlock ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-center p-6 bg-slate-900/40 border border-dashed border-slate-800 rounded-xl my-auto">
                                <div className="w-16 h-16 rounded-full bg-emerald-950 border border-emerald-500/30 flex items-center justify-center mb-4 text-emerald-400 animate-bounce">
                                    ⚾
                                </div>
                                <h3 className="stadium-font text-sm font-bold text-slate-200 uppercase tracking-wider mb-2">Batter Up!</h3>
                                <p className="text-xs text-slate-400 leading-relaxed max-w-xs">
                                    Hover or click on any individual census block to unlock hyper-local stadium visit tracking data.
                                </p>
                                <div className="mt-8 pt-4 border-t border-slate-900 w-full text-left">
                                    <span className="text-[10px] uppercase font-bold text-slate-500 tracking-wider block mb-1">Dataset Coverage:</span>
                                    <span className="text-xs text-emerald-400 font-mono font-bold bg-emerald-950/40 px-2 py-1 rounded border border-emerald-900/50">
                                        {totalLoadedBlocks > 0 ? `${totalLoadedBlocks.toLocaleString()} Active Blocks Monitored` : 'Scanning Roster...'}
                                    </span>
                                </div>
                            </div>
                        ) : (
                          <div className="space-y-6">
                            {/* Block Information Plate */}
                            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 relative overflow-hidden shadow-inner">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-[10px] font-bold uppercase text-slate-400 bg-slate-800 px-2 py-0.5 rounded tracking-wider">
                                        Census Geography ID
                                    </span>
                                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-ping" />
                                </div>
                                <div className="scoreboard-font text-lg text-emerald-400 tracking-wider">
                                    {activeBlock.geoid}
                                </div>
                                <div className="mt-3 pt-2 border-t border-slate-800/60 flex items-center justify-between">
                                    <span className="text-xs text-slate-400 font-medium">Territorial Rule:</span>
                                    <span className={`text-xs font-bold px-2 py-0.5 rounded uppercase tracking-wider ${
                                        cubsFract > 0.5 
                                            ? 'bg-blue-950 text-blue-400 border border-blue-900' 
                                            : soxFract > 0.5 
                                                ? 'bg-zinc-900 text-zinc-300 border border-zinc-800' 
                                                : 'bg-slate-800 text-slate-300'
                                    }`}>
                                        {cubsFract > 0.5 ? '🔴 Cubs Domain' : soxFract > 0.5 ? '⚪ Sox Domain' : '⚔️ Toss-Up Zone'}
                                    </span>
                                </div>
                            </div>

                            {/* Scoreboard Split Display (Fixed: No double percentage multiplying) */}
                            <div>
                                <h3 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-3 flex items-center gap-2">
                                    <span>📊</span> Fan Allegiance Split
                                </h3>
                                
                                <div className="grid grid-cols-2 gap-px bg-slate-800 rounded-xl overflow-hidden border border-slate-800 shadow-md">
                                    <div className="bg-slate-900 p-4 text-center border-r border-slate-800/80">
                                        <div className="stadium-font text-[11px] font-bold text-blue-400 uppercase tracking-widest mb-1">CUBS</div>
                                        <div className="scoreboard-font text-3xl font-black text-white drop-shadow">
                                            {(cubsFract * 100).toFixed(1)}<span className="text-sm text-blue-500">%</span>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 p-4 text-center">
                                        <div className="stadium-font text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1">WHITE SOX</div>
                                        <div className="scoreboard-font text-3xl font-black text-white drop-shadow">
                                            {(soxFract * 100).toFixed(1)}<span className="text-sm text-slate-500">%</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-4 bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                                    <div className="flex justify-between text-xs text-slate-400 font-semibold px-1">
                                        <span className="flex items-center gap-1"><span className="text-blue-500">🔵</span> Wrigley Arrivals</span>
                                        <span className="flex items-center gap-1">The Rate Arrivals <span className="text-zinc-400">⚪</span></span>
                                    </div>
                                    
                                    <div className="w-full h-6 bg-slate-950 rounded-full overflow-hidden flex border border-slate-800 p-0.5">
                                        <div 
                                            className="h-full bg-gradient-to-r from-blue-700 to-blue-500 rounded-l-full transition-all duration-300 relative flex items-center justify-start pl-2"
                                            style={{ width: `${cubsFract * 100}%` }}
                                        >
                                            {cubsFract > 0.15 && (
                                                <span className="text-[10px] font-bold text-white scoreboard-font">
                                                    {Math.round(cubsFract * 100)}
                                                </span>
                                            )}
                                        </div>
                                        <div 
                                            className="h-full bg-gradient-to-r from-zinc-600 to-zinc-900 rounded-r-full transition-all duration-300 relative flex items-center justify-end pr-2"
                                            style={{ width: `${soxFract * 100}%` }}
                                        >
                                            {soxFract > 0.15 && (
                                                <span className="text-[10px] font-bold text-zinc-300 scoreboard-font">
                                                    {Math.round(soxFract * 100)}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Diamond Position Chart (Fixed: Clear absolute grid layout avoiding transform rotation shift) */}
                            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                <h3 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-4">
                                    🏟️ Home Plate Bias Index
                                </h3>
                                <div className="flex items-center justify-center py-2">
                                    <div className="relative w-32 h-32 bg-slate-950/40 border border-slate-800 rounded-xl flex items-center justify-center">
                                        
                                        {/* Pure CSS Base Diamond Lines */}
                                        <div className="absolute w-20 h-20 border border-dashed border-slate-700 transform rotate-45" />
                                        
                                        {/* Physical Base Markers */}
                                        <div className="absolute top-2 w-3 h-3 bg-slate-700 rounded-sm transform rotate-45" title="Second Base (North)" />
                                        <div className="absolute bottom-2 w-3 h-3 bg-slate-400 rounded-sm transform rotate-45" title="Home Plate (South)" />
                                        <div className="absolute left-2 w-3 h-3 bg-slate-700 rounded-sm transform rotate-45" title="Third Base (West)" />
                                        <div className="absolute right-2 w-3 h-3 bg-slate-700 rounded-sm transform rotate-45" title="First Base (East)" />
                                        
                                        {/* Labels */}
                                        <div className="absolute top-6 text-[9px] font-bold text-blue-400 tracking-wider uppercase">Wrigley</div>
                                        <div className="absolute bottom-6 text-[9px] font-bold text-slate-400 tracking-wider uppercase">The Rate</div>

                                        {/* Dynamic Ball - Moves directly up to Second base or down to Home plate along the vertical meridian line */}
                                        <div 
                                            className={`absolute w-7 h-7 rounded-full shadow-2xl border flex items-center justify-center font-bold text-xs transition-all duration-500 z-10 ${
                                                cubsFract > 0.5 
                                                    ? 'bg-blue-600 text-white border-white' 
                                                    : soxFract > 0.5 
                                                        ? 'bg-zinc-100 text-slate-950 border-black' 
                                                        : 'bg-amber-400 text-slate-950 border-white'
                                            }`}
                                            style={{
                                                // Center point is top: 50%. Cubs moves it up (towards 15%), Sox moves it down (towards 85%)
                                                top: `${50 - (cubsFract - soxFract) * 35}%`,
                                                left: '50%',
                                                transform: 'translate(-50%, -50%)'
                                            }}
                                        >
                                            ⚾
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-between text-[10px] font-mono text-slate-500 uppercase mt-2 px-2">
                                    <span className="text-blue-500 font-bold">North Side Bias</span>
                                    <span className="text-zinc-400 font-bold">South Side Bias</span>
                                </div>
                            </div>
                          </div>
                        )}
                    </div>

                    <div className="p-4 bg-slate-950 border-t border-slate-900 text-xs">
                        <span className="text-[10px] font-bold text-slate-500 uppercase block mb-2 tracking-wider">
                            Map Allegiopole Scale Key
                        </span>
                        <div className="flex h-3 w-full rounded bg-gradient-to-r from-black via-slate-500 to-blue-700 border border-slate-800" />
                        <div className="flex justify-between text-[9px] font-mono text-slate-400 mt-1">
                            <span>100% Sox</span>
                            <span>50/50 Split</span>
                            <span>100% Cubs</span>
                        </div>
                    </div>
                </div>
            );
        }

        function BaseballMap({ onFeatureHover, setTotalBlocks, setIsLoading, setLoadedChunks }) {
            const mapRef = useRef(null);

            useEffect(() => {
                mapRef.current = L.map('leaflet-map-element', {
                    center: [41.8781, -87.6298],
                    zoom: 11,
                    zoomControl: false,
                    renderer: L.canvas({ tolerance: 3 })
                });

                L.control.zoom({ position: 'topright' }).addTo(mapRef.current);

                // FIXED BASEMAP STYLE: Switched from dark matter to elegant CartoDB Positron light map with clear streets and labels
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
                }).addTo(mapRef.current);

                const cubsIcon = L.divIcon({
                    className: 'custom-stadium-marker',
                    html: `<div class="flex flex-col items-center"><div class="bg-blue-600 text-white font-black border border-white rounded px-1.5 py-0.5 text-[10px] whitespace-nowrap shadow-lg font-mono">WRIGLEY FIELD ⚾</div></div>`,
                    iconSize: [100, 24],
                    iconAnchor: [50, 12]
                });

                const soxIcon = L.divIcon({
                    className: 'custom-stadium-marker',
                    html: `<div class="flex flex-col items-center"><div class="bg-black text-white font-black border border-zinc-400 rounded px-1.5 py-0.5 text-[10px] whitespace-nowrap shadow-lg font-mono">THE RATE 🏟️</div></div>`,
                    iconSize: [100, 24],
                    iconAnchor: [50, 12]
                });

                L.marker(WRIGLEY_COORDS, { icon: cubsIcon }).addTo(mapRef.current);
                L.marker(RATE_FIELD_COORDS, { icon: soxIcon }).addTo(mapRef.current);

                const fileUrls = [
                    './chicago_baseball_map_1.geojson',
                    './chicago_baseball_map_2.geojson',
                    './chicago_baseball_map_3.geojson',
                    './chicago_baseball_map_4.geojson'
                ];

                setIsLoading(true);
                let completedChunks = 0;
                let runningTotalFeatures = 0;

                function styleFeature(feature) {
                    const cubsShare = feature.properties.cubs_share || 0;
                    return {
                        fillColor: getFeatureColor(cubsShare),
                        weight: 0.3,
                        opacity: 0.3,
                        color: '#475569', // Dark grey boundaries make individual blocks pop perfectly on the light background
                        fillOpacity: 0.65
                    };
                }

                function onEachFeature(feature, layer) {
                    layer.on({
                        mouseover: (e) => {
                            const currentLayer = e.target;
                            currentLayer.setStyle({
                                weight: 2.0,
                                color: '#D97706', // Dynamic amber outline highlighting the active parcel boundary 
                                fillOpacity: 0.9
                            });
                            onFeatureHover(feature.properties);
                        },
                        mouseout: (e) => {
                            e.target.setStyle(styleFeature(feature));
                        },
                        click: (e) => {
                            mapRef.current.fitBounds(e.target.getBounds(), { maxZoom: 14 });
                            onFeatureHover(feature.properties);
                        }
                    });
                }

                fileUrls.forEach(url => {
                    fetch(url)
                        .then(res => {
                            if (!res.ok) throw new Error(`Could not load ${url}`);
                            return res.json();
                        })
                        .then(geojsonData => {
                            completedChunks++;
                            setLoadedChunks(completedChunks);
                            runningTotalFeatures += geojsonData.features.length;
                            setTotalBlocks(runningTotalFeatures);

                            L.geoJSON(geojsonData, {
                                style: styleFeature,
                                onEachFeature: onEachFeature
                            }).addTo(mapRef.current);

                            if (completedChunks === 4) {
                                setIsLoading(false);
                            }
                        })
                        .catch(err => console.error("Segment error: ", err));
                });

                return () => {
                    if (mapRef.current) mapRef.current.remove();
                };
            }, [onFeatureHover, setTotalBlocks, setIsLoading, setLoadedChunks]);

            return <div id="leaflet-map-element" className="w-full h-full bg-slate-100" />;
        }

        function App() {
            const [activeBlock, setActiveBlock] = useState(null);
            const [totalBlocks, setTotalBlocks] = useState(0);
            const [isLoading, setIsLoading] = useState(true);
            const [loadedChunks, setLoadedChunks] = useState(0);

            const handleFeatureHover = useMemo(() => (properties) => {
                setActiveBlock(properties);
            }, []);

            return (
                <div className="flex flex-col lg:flex-row h-screen w-screen overflow-hidden bg-slate-900">
                    <ScoreboardPanel 
                        activeBlock={activeBlock} 
                        totalLoadedBlocks={totalBlocks} 
                        isLoading={isLoading}
                        loadedChunks={loadedChunks}
                    />
                    <div className="flex-1 h-full relative">
                        <BaseballMap 
                            onFeatureHover={handleFeatureHover} 
                            setTotalBlocks={setTotalBlocks} 
                            setIsLoading={setIsLoading}
                            setLoadedChunks={setLoadedChunks}
                        />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
